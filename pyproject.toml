[project]
name = "rl-lab"
version = "0.1.0"
description = "Experiments with SFT, DPO, GRPO/PPO and distillation using QLoRA, tracked in MLflow"
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.4",
    "transformers>=4.46",
    "trl>=0.12",
    "peft>=0.13",
    "datasets>=3.0",
    "accelerate>=1.0",
    "mlflow>=2.16",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    # QLoRA 4-bit quantization; Linux (rented GPU servers) only
    "bitsandbytes>=0.44; sys_platform == 'linux'",
]

[project.optional-dependencies]
gen = ["vllm>=0.6; sys_platform == 'linux'"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
