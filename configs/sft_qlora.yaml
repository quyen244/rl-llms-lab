# SFT with QLoRA. Smoke-test model is tiny; swap model.name for a 7B on a rented GPU.
method: sft
experiment: sft-qlora

model:
  name: Qwen/Qwen2.5-0.5B-Instruct
  load_in_4bit: true          # QLoRA (needs bitsandbytes, Linux)
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true
  compute_dtype: auto         # bfloat16 if the GPU supports it, else float16 (T4, V100)

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: all-linear

data:
  name: trl-lib/Capybara
  split: train
  max_samples: 1500            # 1.5k training rows (learning-scale run)

hub:
  push: false                 # true pushes the adapter to a private HF repo (needs HF_USERNAME, HF_TOKEN)

train:
  output_dir: outputs/sft-qlora
  max_length: 1024
  per_device_train_batch_size: 8
  gradient_accumulation_steps: 2
  learning_rate: 2.0e-4
  num_train_epochs: 1
  max_steps: -1
  warmup_steps: 0.03
  lr_scheduler_type: cosine
  logging_steps: 10
  save_steps: 200
  gradient_checkpointing: true   # off spilled past 16 GB at batch 16 (10 s/step); on = 1.9 GB
  seed: 42

eval:
  gsm8k_samples: 1000          # first 1k GSM8K test questions
  batch_size: 128              # eval generation batch, capped at 96-128 (owner rule)

cost:
  gpu_hourly_usd: null         # rental price per GPU hour; fill in to get cost in the report
