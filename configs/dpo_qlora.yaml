# DPO with QLoRA. The frozen reference model is the base with the adapter disabled.
method: dpo
experiment: dpo-qlora

model:
  name: Qwen/Qwen2.5-0.5B-Instruct   # or an SFT-merged checkpoint
  load_in_4bit: true
  bnb_4bit_quant_type: nf4
  bnb_4bit_use_double_quant: true
  compute_dtype: auto

lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules: all-linear

data:
  name: trl-lib/ultrafeedback_binarized
  split: train
  max_samples: 1500            # 1.5k training rows (learning-scale run)

hub:
  push: false

train:
  output_dir: outputs/dpo-qlora
  beta: 0.1
  max_length: 1024
  per_device_train_batch_size: 2
  gradient_accumulation_steps: 8
  learning_rate: 5.0e-6
  num_train_epochs: 1
  max_steps: -1
  warmup_steps: 0.1
  lr_scheduler_type: cosine
  logging_steps: 10
  save_steps: 200
  gradient_checkpointing: true
  seed: 42

eval:
  gsm8k_samples: 1000          # first 1k GSM8K test questions

cost:
  gpu_hourly_usd: null         # rental price per GPU hour; fill in to get cost in the report
